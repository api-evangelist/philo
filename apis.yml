aid: philo
name: Philo
description: 'Philo is a US live-television streaming service founded at Harvard in 2010
  as Tivli, renamed in 2013 after television inventor Philo T. Farnsworth, and launched
  to the public in 2017. Headquartered at 225 Green Street in San Francisco, it delivers
  70+ entertainment and lifestyle channels, 75,000+ on-demand titles, 120+ free ad-supported
  channels, and unlimited one-year DVR from $25/month across web, iOS, Android, Roku,
  Fire TV, Apple TV and Chromecast, with TV Everywhere sign-in to partner network apps.
  Philo publishes no public developer program: its product GraphQL endpoint at
  www.philo.com/graphql is live but has introspection disabled, and the only machine-readable
  documents it serves are IAB Tech Lab advertising-transparency files (ads.txt, app-ads.txt,
  sellers.json), an RFC 9116 security.txt, and an Instatus status page with a JSON API.'
